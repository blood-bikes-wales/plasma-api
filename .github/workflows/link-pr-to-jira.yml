name: Link PR to Jira

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  link-pr-to-jira:
    runs-on: ubuntu-latest

    steps:
      - name: Extract Jira ticket key
        id: jira
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.head_ref }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
        run: |
          set -euo pipefail

          JIRA_BASE_URL="${JIRA_BASE_URL%/}"

          extract_jira_key() {
            local text="$1"
            local key
            key="$(printf '%s' "$text" | grep -oE '\[[A-Z][A-Z0-9]+-[0-9]+\]' | head -n1 | tr -d '[]' || true)"
            if [ -z "$key" ]; then
              key="$(printf '%s' "$text" | grep -oE '[A-Z][A-Z0-9]+-[0-9]+' | head -n1 || true)"
            fi
            printf '%s' "$key"
          }

          JIRA_KEY="$(extract_jira_key "$PR_TITLE")"
          if [ -z "$JIRA_KEY" ]; then
            JIRA_KEY="$(extract_jira_key "$PR_BRANCH")"
          fi

          if [ -z "$JIRA_KEY" ]; then
            echo "No Jira key found in PR title or branch."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found Jira key: $JIRA_KEY"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "key=$JIRA_KEY" >> "$GITHUB_OUTPUT"
          echo "url=${JIRA_BASE_URL}/browse/${JIRA_KEY}" >> "$GITHUB_OUTPUT"

      - name: Link PR on Jira issue
        if: steps.jira.outputs.found == 'true'
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_CLOUD_ID: ${{ secrets.JIRA_CLOUD_ID }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_KEY: ${{ steps.jira.outputs.key }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Trim secrets — trailing newlines from `gh secret set` break Basic auth.
          JIRA_BASE_URL="$(printf '%s' "${JIRA_BASE_URL:-}" | tr -d '[:space:]')"
          JIRA_BASE_URL="${JIRA_BASE_URL%/}"
          JIRA_CLOUD_ID="$(printf '%s' "${JIRA_CLOUD_ID:-}" | tr -d '[:space:]')"
          JIRA_EMAIL="$(printf '%s' "${JIRA_EMAIL:-}" | tr -d '[:space:]')"
          JIRA_API_TOKEN="$(printf '%s' "${JIRA_API_TOKEN:-}" | tr -d '[:space:]')"

          if [ -z "$JIRA_EMAIL" ] || [ -z "$JIRA_API_TOKEN" ]; then
            echo "Missing JIRA_EMAIL or JIRA_API_TOKEN secret."
            exit 1
          fi

          if [ -z "$JIRA_CLOUD_ID" ]; then
            if [ -z "$JIRA_BASE_URL" ]; then
              echo "Missing JIRA_CLOUD_ID (or JIRA_BASE_URL to resolve it)."
              exit 1
            fi
            echo "Resolving cloud ID from ${JIRA_BASE_URL}/_edge/tenant_info"
            JIRA_CLOUD_ID="$(curl --fail-with-body -sS "${JIRA_BASE_URL}/_edge/tenant_info" | jq -r '.cloudId')"
          fi

          if [ -z "$JIRA_CLOUD_ID" ] || [ "$JIRA_CLOUD_ID" = "null" ]; then
            echo "Could not determine Atlassian site cloud ID."
            exit 1
          fi

          # Scoped API tokens: https://api.atlassian.com/ex/jira/{cloudId}/...
          # Classic (unscoped) tokens: https://your-domain.atlassian.net/...
          # https://developer.atlassian.com/cloud/jira/platform/oauth-2-3lo-apps/#3-2-construct-the-request-url
          # https://support.atlassian.com/atlassian-account/docs/manage-api-tokens-for-your-atlassian-account/
          SCOPED_API_BASE="https://api.atlassian.com/ex/jira/${JIRA_CLOUD_ID}"
          echo "Auth email length: ${#JIRA_EMAIL}; token length: ${#JIRA_API_TOKEN}"

          resolve_api_base() {
            local response http_code body
            response="$(curl -sS -w '\n%{http_code}' \
              -u "${JIRA_EMAIL}:${JIRA_API_TOKEN}" \
              -H "Accept: application/json" \
              "${SCOPED_API_BASE}/rest/api/3/myself")"
            http_code="$(printf '%s' "$response" | tail -n1)"
            body="$(printf '%s' "$response" | sed '$d')"
            if [ "$http_code" = "200" ]; then
              echo "$body" | jq -r '"Authenticated via scoped gateway as: \(.displayName // .emailAddress // .accountId)"' >&2
              printf '%s' "$SCOPED_API_BASE"
              return 0
            fi

            echo "Scoped gateway returned HTTP ${http_code}; trying classic site URL." >&2
            if [ -z "$JIRA_BASE_URL" ]; then
              echo "Missing JIRA_BASE_URL for classic-token fallback." >&2
              return 1
            fi

            response="$(curl -sS -w '\n%{http_code}' \
              -u "${JIRA_EMAIL}:${JIRA_API_TOKEN}" \
              -H "Accept: application/json" \
              "${JIRA_BASE_URL}/rest/api/3/myself")"
            http_code="$(printf '%s' "$response" | tail -n1)"
            body="$(printf '%s' "$response" | sed '$d')"
            if [ "$http_code" = "200" ]; then
              echo "$body" | jq -r '"Authenticated via site URL as: \(.displayName // .emailAddress // .accountId)"' >&2
              printf '%s' "$JIRA_BASE_URL"
              return 0
            fi

            echo "Jira auth failed on scoped gateway and site URL (last HTTP ${http_code})." >&2
            echo "Check JIRA_EMAIL matches the account that created JIRA_API_TOKEN," >&2
            echo "and that a scoped token uses write:jira-work (or classic scopes covering remote links)." >&2
            return 1
          }

          JIRA_API_BASE="$(resolve_api_base)"
          echo "Using Jira API base: ${JIRA_API_BASE}"

          jq -n \
            --arg globalId "github:${REPOSITORY}:pull:${PR_NUMBER}" \
            --arg prTitle "PR #${PR_NUMBER}: ${PR_TITLE}" \
            --arg prUrl "$PR_URL" \
            --arg repo "$REPOSITORY" \
            '{
              globalId: $globalId,
              application: {
                type: "com.github",
                name: "GitHub"
              },
              relationship: "pull request",
              object: {
                url: $prUrl,
                title: $prTitle,
                summary: ("Pull request in " + $repo)
              }
            }' > jira-remote-link.json

          curl --fail-with-body -sS \
            -u "${JIRA_EMAIL}:${JIRA_API_TOKEN}" \
            -X POST \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            --data @jira-remote-link.json \
            "${JIRA_API_BASE}/rest/api/3/issue/${JIRA_KEY}/remotelink"

      - name: Add or update PR comment with Jira link
        if: steps.jira.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          JIRA_KEY: ${{ steps.jira.outputs.key }}
          JIRA_URL: ${{ steps.jira.outputs.url }}
        run: |
          set -euo pipefail

          MARKER="<!-- jira-link:${JIRA_KEY} -->"
          COMMENT_BODY="$(printf 'Linked Jira ticket: [%s](%s)\n\n%s\n' "$JIRA_KEY" "$JIRA_URL" "$MARKER")"

          COMMENTS_JSON="$(curl --fail-with-body -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${REPOSITORY}/issues/${PR_NUMBER}/comments")"

          EXISTING_COMMENT_ID="$(echo "$COMMENTS_JSON" | jq -r --arg marker "$MARKER" '.[] | select(.body | contains($marker)) | .id' | head -n1)"

          jq -n --arg body "$COMMENT_BODY" '{ body: $body }' > github-comment.json

          if [ -n "$EXISTING_COMMENT_ID" ]; then
            echo "Updating existing Jira link comment: ${EXISTING_COMMENT_ID}"

            curl --fail-with-body -L \
              -X PATCH \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              --data @github-comment.json \
              "https://api.github.com/repos/${REPOSITORY}/issues/comments/${EXISTING_COMMENT_ID}"
          else
            echo "Creating new Jira link comment"

            curl --fail-with-body -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              --data @github-comment.json \
              "https://api.github.com/repos/${REPOSITORY}/issues/${PR_NUMBER}/comments"
          fi
